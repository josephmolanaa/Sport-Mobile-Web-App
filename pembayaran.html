<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pembayaran — Warrior Sport</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body>
    <header class="page-nav">
      <nav class="nav container">
        <a class="brand" href="index.html"
          ><span class="brand-mark">W</span
          ><span>warrior<span class="brand-accent">sport</span></span></a
        ><a class="text-link" href="detail.html">← Kembali</a>
      </nav>
    </header>
    <main class="page-shell">
      <div class="container">
        <div class="page-title">
          <div>
            <span class="eyebrow">Selesaikan pesanan</span>
            <h1>Pembayaran</h1>
            <p>Data pembayaran aman dan terenkripsi.</p>
          </div>
        </div>
        <div class="page-grid">
          <section class="page-card">
            <h2 style="color: var(--deep)">Data pemesan</h2>
            <div class="form-grid">
              <div class="form-group">
                <label>Nama lengkap<input placeholder="Nama lengkap" /></label>
              </div>
              <div class="form-group">
                <label
                  >Nomor WhatsApp<input placeholder="08xxxxxxxxxx"
                /></label>
              </div>
              <div class="form-group full">
                <label
                  >Email<input type="email" placeholder="nama@email.com"
                /></label>
              </div>
            </div>
            <h2 style="color: var(--deep); margin-top: 30px">
              Metode pembayaran
            </h2>
            <div class="chips">
              <button class="chip" data-toast="Metode QRIS dipilih">QRIS</button
              ><button class="chip" data-toast="Metode transfer bank dipilih">
                Transfer Bank</button
              ><button class="chip" data-toast="Metode e-wallet dipilih">
                E-Wallet
              </button>
            </div>
            <button
              class="btn btn-primary full-btn"
              data-toast="Pesanan berhasil dibuat. Cek halaman pesanan."
            >
              Bayar Rp150.000
            </button>
          </section>
          <aside class="page-card summary">
            <h2>Detail booking</h2>
            <div class="summary-row">
              <span>Warrior Futsal Arena</span><b>1 jam</b>
            </div>
            <div class="summary-row">
              <span>Hari ini, 10:00</span><b>Rp150.000</b>
            </div>
            <div class="summary-row">
              <span>Biaya layanan</span><b>Gratis</b>
            </div>
            <div class="summary-row total">
              <span>Total</span><strong>Rp150.000</strong>
            </div>
          </aside>
        </div>
      </div>
    </main>
    <div class="toast" id="toast"></div>
    <script src="app.js"></script>
  </body>
</html>
