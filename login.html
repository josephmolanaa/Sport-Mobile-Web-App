<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Masuk | CourtGo</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card">
        <a class="brand" href="index.html"
          ><img class="brand-logo" src="logo.png" alt="SM Futsal Malang"
        /></a>
        <h1>Selamat datang kembali</h1>
        <p>Masuk untuk melihat booking dan mengelola akunmu.</p>
        <form
          onsubmit="
            event.preventDefault();
            location.href = 'riwayat-pesanan.html';
          "
        >
          <label
            >Email<input
              type="email"
              placeholder="nama@email.com"
              required /></label
          ><label
            >Password<input
              type="password"
              placeholder="••••••••"
              required /></label
          ><button class="btn btn-primary" type="submit">Masuk</button>
        </form>
        <div class="auth-footer">
          Belum punya akun? <a href="#daftar">Daftar sekarang</a>
        </div>
      </section>
    </main>
  </body>
</html>
